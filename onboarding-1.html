<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · 建档 1/3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #FBF9F5; --surface: #FFFFFF; --border: #F0EAE1;
    --ink: #2D3142; --ink-2: #6C757D;
    --primary: #00796B; --primary-deep: #00695C; --primary-light: #E6F6F2;
    --success: #2F7D4F; --success-bg: #E6F4EA; --success-text: #137333;
    --radius: 24px; --radius-btn: 999px;
    --shadow-smooth: 0 10px 30px -5px rgba(45,49,66,.05), 0 4px 12px -2px rgba(45,49,66,.03);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #D8D6D0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #232323; border-radius: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 10px 24px 30px; display: flex; flex-direction: column; }

  /* 进度条 */
  .progress { display: flex; gap: 6px; margin: 4px 0 20px; }
  .progress .bar { flex: 1; height: 6px; border-radius: 3px; background: #E5E3DC; }
  .progress .bar.on { background: var(--primary); }

  /* 步骤标签 */
  .step-tag { display: inline-flex; align-items: center; gap: 6px; background: #EFF5FB; color: var(--primary-deep); font-size: 15px; font-weight: 600; padding: 6px 12px; border-radius: 999px; align-self: flex-start; }

  .welcome-icon {
    width: 120px; height: 120px; border-radius: 32px; margin: 36px auto 24px;
    background: linear-gradient(135deg, #EFF5FB, #DCEAF6);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .welcome-icon .heart { font-size: 52px; }
  .welcome-icon .wave {
    position: absolute; bottom: -6px; width: 26px; height: 6px; border-radius: 3px;
    background: var(--primary); opacity: .25; animation: wave 1.4s ease-in-out infinite;
  }
  .welcome-icon .wave.w2 { left: 30px; animation-delay: .2s; }
  .welcome-icon .wave.w3 { right: 30px; animation-delay: .4s; }
  @keyframes wave { 0%,100% { transform: scaleY(.5); } 50% { transform: scaleY(1.2); } }
  @media (prefers-reduced-motion: reduce) { .welcome-icon .wave { animation: none; } }

  h1 { font-size: 28px; font-weight: 700; color: var(--ink); text-align: center; line-height: 1.35; }
  .sub { font-size: 17px; color: var(--ink-2); text-align: center; margin-top: 10px; line-height: 1.6; }
  .tip {
    margin-top: 22px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; font-size: 15px; color: var(--ink-2); line-height: 1.6;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .tip .t-icon { font-size: 18px; flex: 0 0 auto; }

  .btn {
    width: 100%; height: 60px; border: none; border-radius: var(--radius-btn); cursor: pointer;
    font-family: inherit; font-size: 21px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #00897B, #00695C); margin-top: auto;
    box-shadow: 0 12px 24px -6px rgba(0,121,107,.3);
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:active { transform: scale(.96); }
  .btn-ghost {
    width: 100%; height: 50px; margin-top: 12px; border-radius: var(--radius-btn);
    background: var(--surface); color: var(--primary-deep); font-size: 19px; font-weight: 700;
    border: 1.5px solid var(--primary); box-shadow: none;
  }
  .foot-note { text-align: center; font-size: 15px; color: var(--ink-2); margin-top: 12px; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>
  <div class="content">
    <div class="progress"><div class="bar on"></div><div class="bar"></div><div class="bar"></div></div>

    <div class="welcome-icon">
      <span class="heart">💊</span>
      <span class="wave w1"></span><span class="wave w2"></span><span class="wave w3"></span>
    </div>

    <h1>奶奶您好，我是小安<br>帮您记住每天吃什么药</h1>
    <div class="sub">我会用语音和您说话<br>您用说的、点的、拍照的都行</div>

    <div class="tip">
      <span class="t-icon">👵</span>
      <span>如果您不方便，可以让家人帮忙填写，之后您只管"听"和"确认"就行。</span>
    </div>

    <button class="btn">开始建档</button>
    <button class="btn-ghost">家人帮我填写</button>
  </div>
</div>
</body>
</html>
