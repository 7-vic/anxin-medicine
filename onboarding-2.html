<style>
  :root {
    --bg: #FBF9F5; --surface: #FFFFFF; --border: #F0EAE1;
    --ink: #2D3142; --ink-2: #6C757D;
    --primary: #00796B; --primary-deep: #00695C; --primary-light: #E6F6F2;
    --success: #2F7D4F; --success-bg: #E6F4EA; --success-text: #137333;
    --radius: 24px; --radius-btn: 999px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #D8D6D0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #232323; border-radius: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 10px 24px 30px; display: flex; flex-direction: column; }
  .progress { display: flex; gap: 6px; margin: 4px 0 20px; }
  .progress .bar { flex: 1; height: 6px; border-radius: 3px; background: #E5E3DC; }
  .progress .bar.on { background: var(--primary); }

  /* AI 对话区 */
  .ai-bubble {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px 18px; font-size: 19px; font-weight: 600; color: var(--ink); line-height: 1.5;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .ai-avatar {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--primary), #3E8BC8);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .ai-voice { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .ai-voice .dots { display: flex; gap: 4px; }
  .ai-voice .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: dot 1s infinite; }
  .ai-voice .dots i:nth-child(2) { animation-delay: .2s; }
  .ai-voice .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ai-voice .dots i { animation: none; } }

  /* 录音大按钮 */
  .mic-area { margin: 32px auto 0; text-align: center; }
  .mic-btn {
    width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #00897B, #00695C); color: #fff; font-size: 40px;
    box-shadow: 0 12px 24px -6px rgba(0,121,107,.35);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .mic-btn:active { transform: scale(.95); }
  .mic-hint { margin-top: 14px; font-size: 17px; font-weight: 600; color: var(--ink); }
  .mic-sub { margin-top: 4px; font-size: 15px; color: var(--ink-2); }

  /* 拍照识别 */
  .camera-row { margin-top: 28px; }
  .camera-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1.5px dashed var(--primary);
    border-radius: 16px; padding: 16px;
  }
  .camera-card .cam-icon {
    width: 52px; height: 52px; border-radius: 14px; background: #EFF5FB;
    display: flex; align-items: center; justify-content: center; font-size: 24px; flex: 0 0 auto;
  }
  .camera-card .cam-text { font-size: 17px; font-weight: 600; color: var(--primary-deep); }
  .camera-card .cam-sub { font-size: 15px; color: var(--ink-2); margin-top: 2px; }

  /* 识别结果（示例） */
  .result {
    margin-top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px;
  }
  .result-title { font-size: 15px; color: var(--ink-2); margin-bottom: 8px; }
  .result-row { display: flex; align-items: center; gap: 12px; }
  .result-pill {
    width: 44px; height: 22px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(90deg, #E8862D 50%, #F6C98B 50%);
  }
  .result-name { font-size: 19px; font-weight: 700; color: var(--ink); flex: 1; }
  .result-edit { font-size: 16px; font-weight: 600; color: var(--primary-deep); background: none; border: none; cursor: pointer; font-family: inherit; }
  .result-note { margin-top: 8px; font-size: 15px; color: var(--success-text); font-weight: 600; }

  .btn { width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none; border: none; border-radius: var(--radius-btn); cursor: pointer; font-family: inherit; font-size: 21px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #00897B, #00695C); margin-top: 24px; box-shadow: 0 12px 24px -6px rgba(0,121,107,.3); transition: all .25s cubic-bezier(.34,1.56,.64,1); }
  .btn:active { transform: scale(.96); }
  .back-btn {
    position: absolute; top: 60px; left: 16px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.88);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,.10);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: var(--ink); text-decoration: none;
  }
  .back-btn:active { transform: scale(.92); }
</style>
</head>
