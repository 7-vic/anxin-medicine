<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · 建档 2/3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #FBF9F5; --surface: #FFFFFF; --border: #F0EAE1;
    --ink: #2D3142; --ink-2: #6C757D;
    --primary: #2E66E7; --primary-deep: #1E4FC4; --primary-light: #EFF4FF;
    --success: #2F7D4F; --success-bg: #E6F4EA; --success-text: #137333;
    --radius: 24px; --radius-btn: 999px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #E8E4DC; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #2D3142; border-radius: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 16px 24px 30px; display: flex; flex-direction: column; }

  .header-nav { display: flex; align-items: center; margin-bottom: 8px; }
  .back-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: var(--ink); text-decoration: none;
    position: static; flex: 0 0 auto;
  }
  .back-btn:active { transform: scale(.94); }

  .progress { display: flex; gap: 6px; margin: 4px 0 20px; }
  .progress .bar { flex: 1; height: 6px; border-radius: 3px; background: #E5E3DC; }
  .progress .bar.on { background: var(--primary); }

  .ai-bubble {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; font-size: 19px; font-weight: 600; color: var(--ink); line-height: 1.5;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .ai-avatar {
    width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--primary), #5B8DEF);
    display: flex; align-items: center; justify-content: center;
  }
  .ai-voice { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .ai-voice .dots { display: flex; gap: 4px; }
  .ai-voice .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: dot 1s infinite; }
  .ai-voice .dots i:nth-child(2) { animation-delay: .2s; }
  .ai-voice .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .ai-voice .dots i { animation: none; } }

  .mic-area { margin: 32px auto 0; text-align: center; }
  .mic-btn {
    width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #E05A2B, #BF360C); color: #fff;
    box-shadow: 0 12px 24px -6px rgba(191,54,12,.35);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto; transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .mic-btn:active { transform: scale(.95); }
  .mic-hint { margin-top: 14px; font-size: 17px; font-weight: 600; color: var(--ink); }
  .mic-sub { margin-top: 4px; font-size: 15px; color: var(--ink-2); }

  .camera-row { margin-top: 28px; }
  .camera-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1.5px dashed var(--primary);
    border-radius: 16px; padding: 16px;
  }
  .camera-card .cam-icon {
    width: 52px; height: 52px; border-radius: 14px; background: var(--primary-light);
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .camera-card .cam-text { font-size: 17px; font-weight: 600; color: var(--primary-deep); }
  .camera-card .cam-sub { font-size: 15px; color: var(--ink-2); margin-top: 2px; }

  .result {
    margin-top: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px;
  }
  .result-title { font-size: 15px; color: var(--ink-2); margin-bottom: 8px; }
  .result-row { display: flex; align-items: center; gap: 12px; }
  .result-pill {
    width: 44px; height: 22px; border-radius: 11px; flex: 0 0 auto;
    background: linear-gradient(90deg, #E8862D 50%, #F6C98B 50%);
  }
  .result-name { font-size: 19px; font-weight: 700; color: var(--ink); flex: 1; }
  .result-edit { font-size: 16px; font-weight: 600; color: var(--primary-deep); background: none; border: none; cursor: pointer; font-family: inherit; }
  .result-note { margin-top: 8px; font-size: 15px; color: var(--success-text); font-weight: 600; }

  .btn {
    width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none;
    border: none; border-radius: var(--radius-btn); cursor: pointer; font-family: inherit;
    font-size: 21px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #E05A2B, #BF360C); margin-top: 24px;
    box-shadow: 0 12px 24px -6px rgba(191,54,12,.3); transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:active { transform: scale(.96); }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.8" fill="#2D3142"/><rect x="5" y="5" width="3" height="7" rx="0.8" fill="#2D3142"/><rect x="10" y="2.5" width="3" height="9.5" rx="0.8" fill="#2D3142"/><rect x="15" y="0" width="3" height="12" rx="0.8" fill="#2D3142" opacity="0.3"/></svg> <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="#2D3142" stroke-width="1.2"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="#2D3142"/><rect x="23.5" y="3.5" width="2.5" height="5" rx="1.2" fill="#2D3142"/></svg></span></div>

  <div class="content">
    <div class="header-nav"><a class="back-btn" href="onboarding-1.html" aria-label="返回">‹</a></div>
    <div class="progress"><div class="bar on"></div><div class="bar on"></div><div class="bar"></div></div>

    <div class="ai-bubble">
      <div class="ai-avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
      <div>奶奶，您需要吃什么药？<br>直接告诉我名字就行</div>
    </div>
    <div class="ai-voice">
      <span class="dots"><i></i><i></i><i></i></span>
      <span>正在播报语音…</span>
    </div>

    <div class="mic-area">
      <button class="mic-btn"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
      <div class="mic-hint">按住说话</div>
      <div class="mic-sub">或者点下面的相机拍药盒</div>
    </div>

    <div class="camera-row">
      <div class="camera-card">
        <div class="cam-icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2E66E7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div>
          <div class="cam-text">拍药盒 / 拍处方</div>
          <div class="cam-sub">对准药盒上的字，我来帮您认</div>
        </div>
      </div>
    </div>

    <div class="result">
      <div class="result-title">我听到的是：</div>
      <div class="result-row">
        <div class="result-pill"></div>
        <div class="result-name">阿莫西林</div>
        <button class="result-edit">不对，修改</button>
      </div>
      <div class="result-note">✓ 已记住：阿莫西林，胶囊</div>
    </div>

    <a class="btn" href="onboarding-3.html">继续，说用量</a>
  </div>
</div>
</body>
</html>
