<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · 我的</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #FBF9F5; --surface: #FFFFFF; --border: #F0EAE1;
    --ink: #2D3142; --ink-2: #6C757D;
    --primary: #2E66E7; --primary-deep: #1E4FC4; --primary-light: #EFF4FF;
    --success: #2F7D4F; --success-bg: #E6F4EA; --success-text: #137333;
    --radius: 24px; --radius-btn: 999px;
    --shadow-smooth: 0 10px 30px -5px rgba(45,49,66,.05), 0 4px 12px -2px rgba(45,49,66,.03);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #E8E4DC; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #232323; border-radius: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 16px 20px 110px; }

  .greeting { margin: 10px 0 16px; }
  .greeting .hi { font-size: 22px; font-weight: 600; color: var(--ink); }

  /* 用户卡 */
  .user-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; align-items: center; gap: 14px;
  }
  .user-avatar { width: 60px; height: 60px; border-radius: 20px; background: linear-gradient(135deg, #FDF3E7, #F0DFC8); display: flex; align-items: center; justify-content: center; font-size: 28px; flex: 0 0 auto; }
  .user-info { flex: 1; }
  .user-name { font-size: 20px; font-weight: 700; color: var(--ink); }
  .user-meta { font-size: 15px; color: var(--ink-2); margin-top: 2px; }
  .user-edit { font-size: 15px; font-weight: 600; color: var(--primary-deep); background: none; border: none; cursor: pointer; font-family: inherit; }

  .section-title { font-size: 18px; font-weight: 600; color: var(--ink); margin: 22px 0 10px; }

  /* 设置列表 */
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .list-row { display: flex; align-items: center; gap: 12px; padding: 15px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .list-row:last-child { border-bottom: none; }
  .list-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: 0 0 auto; }
  .list-text { flex: 1; font-size: 17px; font-weight: 500; color: var(--ink); }
  .list-sub { font-size: 14px; color: var(--ink-2); }
  .list-arrow { color: var(--ink-2); font-size: 18px; }

  /* 开关 */
  .switch { width: 48px; height: 28px; border-radius: 14px; background: var(--primary); position: relative; flex: 0 0 auto; cursor: pointer; }
  .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
  .switch.off { background: #E8E4DC; }
  .switch.off::after { right: auto; left: 3px; }

  /* 隐私提示 */
  .privacy { margin-top: 16px; padding: 12px 14px; background: #EFF4FF; border-radius: 12px; font-size: 14px; color: var(--primary-deep); line-height: 1.6; }

  /* 悬浮胶囊 TabBar */
  .tabbar {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 40px); max-width: 360px; height: 60px;
    background: rgba(255,255,255,.94);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-radius: 30px; box-shadow: 0 10px 28px rgba(0,0,0,.12);
    display: flex; align-items: center; justify-content: space-around;
    z-index: 30; padding: 0 8px;
  }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; height: 100%; text-decoration: none; color: inherit; }
  .tab-icon { width: 22px; height: 22px; color: var(--ink-2); flex: 0 0 auto; }
  .tab.active .tab-icon { color: var(--primary); }
  .tab-label { font-size: 14px; color: var(--ink-2); font-weight: 600; }
  .tab.active .tab-label { color: var(--primary); font-weight: 700; }
</style>
</head>
