<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · 建档 3/3</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #FBF9F5; --surface: #FFFFFF; --border: #F0EAE1;
    --ink: #2D3142; --ink-2: #6C757D;
    --primary: #00796B; --primary-deep: #00695C; --primary-light: #E6F6F2;
    --success: #2F7D4F; --success-bg: #E6F4EA; --success-text: #137333;
    --radius: 24px; --radius-btn: 999px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #D8D6D0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #232323; border-radius: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 10px 24px 30px; display: flex; flex-direction: column; }
  .progress { display: flex; gap: 6px; margin: 4px 0 20px; }
  .progress .bar { flex: 1; height: 6px; border-radius: 3px; background: #E5E3DC; }
  .progress .bar.on { background: var(--primary); }

  .ai-bubble {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 18px; font-size: 19px; font-weight: 600; color: var(--ink); line-height: 1.5;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .ai-avatar { width: 40px; height: 40px; border-radius: 12px; flex: 0 0 auto; background: linear-gradient(135deg, var(--primary), #3E8BC8); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .ai-voice { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }

  /* 计划确认卡 */
  .plan-card {
    margin-top: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
  }
  .plan-row { display: flex; align-items: center; gap: 12px; padding: 15px 16px; border-bottom: 1px solid var(--border); }
  .plan-row:last-child { border-bottom: none; }
  .plan-pill { width: 40px; height: 20px; border-radius: 10px; flex: 0 0 auto; background: linear-gradient(90deg, #E8862D 50%, #F6C98B 50%); }
  .plan-info { flex: 1; }
  .plan-name { font-size: 18px; font-weight: 700; color: var(--ink); }
  .plan-detail { font-size: 15px; color: var(--ink-2); margin-top: 2px; }

  /* 过敏史重点 */
  .allergy {
    margin-top: 16px; padding: 14px 16px; background: #FDF0E3; border: 1.5px solid #F0CFA8;
    border-radius: 14px; display: flex; gap: 12px; align-items: flex-start;
  }
  .allergy .a-icon { font-size: 22px; flex: 0 0 auto; }
  .allergy .a-text { font-size: 16px; font-weight: 600; color: #9E4A0B; line-height: 1.5; }
  .allergy .a-sub { font-size: 14px; font-weight: 400; color: #B5753A; margin-top: 2px; }

  /* 过敏选择卡 */
  .allergy-actions { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .btn-no-allergy {
    height: 52px; border-radius: 999px; border: none; cursor: pointer; font-family: inherit;
    background: var(--success-bg); color: var(--success-text);
    font-size: 18px; font-weight: 700;
  }
  .btn-add-allergy {
    height: 52px; border-radius: 999px; cursor: pointer; font-family: inherit;
    background: var(--surface); color: var(--primary-deep);
    border: 1.5px solid var(--primary);
    font-size: 18px; font-weight: 700;
  }

  .btn { width: 100%; height: 60px; display: flex; align-items: center; justify-content: center; text-decoration: none; border: none; border-radius: var(--radius-btn); cursor: pointer; font-family: inherit; font-size: 21px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #00897B, #00695C); margin-top: auto; box-shadow: 0 12px 24px -6px rgba(0,121,107,.3); transition: all .25s cubic-bezier(.34,1.56,.64,1); }
  .btn:active { transform: scale(.96); }
  .btn-ghost { display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%; height: 50px; margin-top: 12px; border-radius: var(--radius-btn); background: var(--surface); color: var(--primary-deep); font-size: 19px; font-weight: 700; border: 1.5px solid var(--primary); box-shadow: none; cursor: pointer; font-family: inherit; }
  .back-btn {
    position: absolute; top: 60px; left: 16px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.88);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,.10);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: var(--ink); text-decoration: none;
  }
  .back-btn:active { transform: scale(.92); }
</style>
</head>
<body>
<div class="phone">
  <a class="back-btn" href="onboarding-2.html" aria-label="返回">‹</a>
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.8" fill="#2D3142"/><rect x="5" y="5" width="3" height="7" rx="0.8" fill="#2D3142"/><rect x="10" y="2.5" width="3" height="9.5" rx="0.8" fill="#2D3142"/><rect x="15" y="0" width="3" height="12" rx="0.8" fill="#2D3142" opacity="0.3"/></svg> <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="#2D3142" stroke-width="1.2"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="#2D3142"/><rect x="23.5" y="3.5" width="2.5" height="5" rx="1.2" fill="#2D3142"/></svg></span></div>
  <div class="content">
    <div class="progress"><div class="bar on"></div><div class="bar on"></div><div class="bar on"></div></div>

    <div class="ai-bubble">
      <div class="ai-avatar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M22 12H18L15 21L9 3L6 12H2" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
      <div>我帮您记下了这些，您听听对不对？</div>
    </div>
    <div class="ai-voice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="#00796B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
 正在播报：阿莫西林，每天 3 次，每次 1 粒，饭后…</div>

    <div class="plan-card">
      <div class="plan-row">
        <div class="plan-pill"></div>
        <div class="plan-info">
          <div class="plan-name">阿莫西林</div>
          <div class="plan-detail">每天 3 次 · 每次 1 粒 · 饭后</div>
        </div>
      </div>
      <div class="plan-row">
        <div class="plan-pill" style="background:linear-gradient(90deg,#2F7D4F 50%,#A8D5B5 50%);"></div>
        <div class="plan-info">
          <div class="plan-name">降压药</div>
          <div class="plan-detail">每天早上 1 次 · 每次 1 粒</div>
        </div>
      </div>
      <div class="plan-row">
        <div class="plan-pill" style="background:linear-gradient(90deg,#1D6BA8 50%,#9DC6E8 50%);"></div>
        <div class="plan-info">
          <div class="plan-name">钙片</div>
          <div class="plan-detail">每天晚上 1 次 · 每次 2 片</div>
        </div>
      </div>
    </div>

    <div class="allergy">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#C05F14"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
      <div class="a-text">
        有没有过敏的药？
        <div class="a-sub">比如青霉素过敏？这个很重要，千万不能记错</div>
      </div>
    </div>

    <div class="allergy-actions">
      <button class="btn-no-allergy">我没有过敏</button>
      <button class="btn-add-allergy">＋ 点此添加过敏药</button>
    </div>

    <a class="btn" href="index.html">对，就这些，开始用药</a>
    <a class="btn-ghost" href="onboarding-2.html">不对，我要改</a>
  </div>
</div>
</body>
</html>
