<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · AI 小助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #FBF9F5; --surface: #FFFFFF; --border: #F0EAE1;
    --ink: #2D3142; --ink-2: #6C757D;
    --primary: #2E66E7; --primary-deep: #1E4FC4; --primary-light: #EFF4FF;
    --success: #2F7D4F; --success-bg: #E6F4EA; --success-text: #137333;
    --radius: 24px; --radius-btn: 999px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #E8E4DC; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #232323; border-radius: 16px; }

  .header { padding: 8px 20px 12px; display: flex; align-items: center; gap: 12px; background: var(--bg); }
  .header .avatar { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #3E8BC8); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .header .title { font-size: 19px; font-weight: 700; color: var(--ink); }
  .header .status { font-size: 14px; color: var(--ink-2); }
  .header .safe {
    margin-left: auto; font-size: 12px; color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px;
  }

  .chat { flex: 1; height: 0; overflow-y: auto; padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 14px 16px; border-radius: 18px; font-size: 17px; line-height: 1.55; }
  .msg.user { align-self: flex-end; background: var(--primary-deep); color: #fff; border-bottom-right-radius: 6px; }
  .msg.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; color: var(--ink); }
  .msg.ai .pill-inline { display: inline-block; width: 18px; height: 9px; border-radius: 5px; background: linear-gradient(90deg,#E8862D 50%,#F6C98B 50%); vertical-align: middle; margin: 0 2px; }
  .msg.ai .ref { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 14px; color: var(--ink-2); }
  .msg.ai .boundary {
    margin-top: 12px; background: #FDF0E3; border-radius: 12px; padding: 10px 12px;
    font-size: 14px; color: #C2410C; font-weight: 500;
  }
  .time-tag { align-self: center; font-size: 13px; color: var(--ink-2); }

  /* 输入区 */
  .input-bar {
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 16px 88px; display: flex; align-items: center; gap: 10px;
  }
  .input-field {
    flex: 1; height: 48px; border-radius: 24px; background: var(--bg);
    border: 1.5px solid var(--border); padding: 0 18px;
    font-size: 17px; font-family: inherit; color: var(--ink);
  }
  .input-field::placeholder { color: var(--ink-2); }
  .mic-btn {
    width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #E05A2B, #BF360C); color: #fff; font-size: 22px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .mic-btn:active { transform: scale(.95); }
  .tabbar {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 40px); max-width: 360px; height: 60px;
    background: rgba(255,255,255,.94);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-radius: 30px; box-shadow: 0 10px 28px rgba(0,0,0,.12);
    display: flex; align-items: center; justify-content: space-around;
    z-index: 30; padding: 0 8px;
  }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 64px; height: 100%; text-decoration: none; color: inherit; }
  .tab-icon { width: 22px; height: 22px; color: var(--ink-2); flex: 0 0 auto; }
  .tab.active .tab-icon { color: var(--primary); }
  .tab-label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .tab.active .tab-label { color: var(--primary); font-weight: 700; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span><svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="0.8" fill="#2D3142"/><rect x="5" y="5" width="3" height="7" rx="0.8" fill="#2D3142"/><rect x="10" y="2.5" width="3" height="9.5" rx="0.8" fill="#2D3142"/><rect x="15" y="0" width="3" height="12" rx="0.8" fill="#2D3142" opacity="0.3"/></svg> <svg width="26" height="12" viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="#2D3142" stroke-width="1.2"/><rect x="2.5" y="2.5" width="14" height="7" rx="1.5" fill="#2D3142"/><rect x="23.5" y="3.5" width="2.5" height="5" rx="1.2" fill="#2D3142"/></svg></span></div>

  <div class="header">
    <div class="avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M22 12H18L15 21L9 3L6 12H2" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
    <div>
      <div class="title">小安助手</div>
      <div class="status">根据您的医嘱回答</div>
    </div>
    <span class="safe"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11M5 11H19C20.1046 11 21 11.8954 21 13V20C21 21.1046 20.1046 22 19 22H5C3.89543 22 3 21.1046 3 20V13C3 11.8954 3.89543 11 5 11Z" stroke="#6C757D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
 不做医疗诊断</span>
  </div>

  <div class="chat">
    <div class="time-tag">今天 8:05</div>
    <div class="msg user">小安，这个药怎么吃来着？</div>
    <div class="msg ai">
      您问的是 <span class="pill-inline"></span> 阿莫西林，我帮您查了医嘱：
      <br><br>每天 <b>3 次</b>，每次 <b>1 粒</b>，<b>饭后</b> 用温水送服。
      <br>下一顿是 <b>中午 12:30</b>，到时间我会提醒您。
      <div class="ref"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> 来源：您的用药档案（8月10日录入）</div>
      <div class="boundary">⚠️ 如果身体有不舒服，请告诉家人或咨询医生。我不是医生，不能判断病情。</div>
    </div>
    <div class="msg user">那我能和降压药一起吃吗？</div>
    <div class="msg ai">
      小安查到：阿莫西林建议 <b>饭后</b> 吃，降压药建议 <b>空腹</b> 吃。
      <div class="boundary">⚠️ 关于这两种药能不能一起用，这是医生和药师才能判断的。请一定要咨询医生或药师，小安不能帮您做决定。</div>
    </div>
  </div>

  <div class="input-bar">
    <input class="input-field" placeholder="按住或输入想问的…">
    <button class="mic-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<g clip-path="url(#clip0_4039_12336)">
<path d="M5 10V12C5 13.8565 5.7375 15.637 7.05025 16.9497C8.36301 18.2625 10.1435 19 12 19C13.8565 19 15.637 18.2625 16.9497 16.9497C18.2625 15.637 19 13.8565 19 12V10M12 19V23M8 23H16M12 1C11.2044 1 10.4413 1.31607 9.87868 1.87868C9.31607 2.44129 9 3.20435 9 4V12C9 12.7956 9.31607 13.5587 9.87868 14.1213C10.4413 14.6839 11.2044 15 12 15C12.7956 15 13.5587 14.6839 14.1213 14.1213C14.6839 13.5587 15 12.7956 15 12V4C15 3.20435 14.6839 2.44129 14.1213 1.87868C13.5587 1.31607 12.7956 1 12 1Z" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</svg>

  </div>
</div>
  <div class="tabbar"><a class="tab" href="index.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span class="tab-label">首页</span></a><a class="tab active" href="assistant.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span class="tab-label">AI 助手</span></a><a class="tab" href="family.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="tab-label">家人</span></a><a class="tab" href="profile.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="tab-label">我的</span></a></div>
