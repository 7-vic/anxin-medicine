<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · 家属</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #F7F6F2; --surface: #FFFFFF; --border: #E5E3DC;
    --ink: #232323; --ink-2: #6B6B6B;
    --primary: #1D6BA8; --primary-deep: #155A8F; --accent: #E8862D;
    --success: #2F7D4F; --success-bg: #EAF4EE; --success-text: #137333;
    --warn-bg: #FDF0E3; --warn-text: #9E4A0B;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #D8D6D0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #232323; border-radius: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 8px 20px 110px; }

  .greeting { display: flex; justify-content: space-between; align-items: flex-end; margin: 10px 0 14px; }
  .greeting .hi { font-size: 22px; font-weight: 600; color: var(--ink); }
  .greeting .sub { font-size: 15px; color: var(--ink-2); margin-top: 2px; }

  /* 老人状态卡 */
  .mom-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; align-items: center; gap: 14px;
  }
  .mom-avatar { width: 56px; height: 56px; border-radius: 18px; background: linear-gradient(135deg, #FDF3E7, #F0DFC8); display: flex; align-items: center; justify-content: center; font-size: 26px; flex: 0 0 auto; }
  .mom-info { flex: 1; }
  .mom-name { font-size: 19px; font-weight: 700; color: var(--ink); }
  .mom-status { font-size: 15px; color: var(--success-text); font-weight: 600; margin-top: 2px; }
  .mom-status.warn { color: var(--warn-text); }

  /* 提醒卡 */
  .notice {
    margin-top: 14px; padding: 14px 16px; border-radius: 16px;
    background: var(--warn-bg); border: 1.5px solid #F0CFA8;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .notice .n-icon { font-size: 22px; flex: 0 0 auto; }
  .notice .n-text { font-size: 16px; font-weight: 600; color: var(--warn-text); line-height: 1.5; flex: 1; }
  .notice .n-sub { font-size: 14px; font-weight: 400; color: #B5753A; margin-top: 2px; }
  .notice .n-btn {
    flex: 0 0 auto; height: 40px; padding: 0 14px; border: none; border-radius: 20px; cursor: pointer;
    background: var(--primary-deep); color: #fff; font-size: 15px; font-weight: 600; font-family: inherit;
    align-self: center;
  }

  .section-title { font-size: 18px; font-weight: 600; color: var(--ink); margin: 22px 0 10px; }

  /* 今日确认进度 */
  .plan { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .plan-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .plan-row:last-child { border-bottom: none; }
  .pill-dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.08); flex: 0 0 auto; }
  .plan-time { font-size: 17px; font-weight: 600; color: var(--ink); width: 58px; flex: 0 0 auto; }
  .plan-name { flex: 1; font-size: 17px; color: var(--ink); }
  .plan-done .plan-time, .plan-done .plan-name { color: #767676; text-decoration: line-through; }
  .plan-now { background: #EFF5FB; }
  .plan-now .plan-name { font-weight: 600; color: var(--primary); }
  .plan-badge { font-size: 15px; font-weight: 700; padding: 4px 12px; border-radius: 12px; background: var(--bg); color: var(--ink-2); flex: 0 0 auto; white-space: nowrap; }
  .plan-done .plan-badge { background: #E6F4EA; color: var(--success-text); }
  .plan-now .plan-badge { background: var(--primary); color: #fff; }
  .plan-miss .plan-badge { background: var(--warn-bg); color: var(--warn-text); }

  /* 绑定家属 */
  .fam-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .fam-avatar { width: 44px; height: 44px; border-radius: 50%; background: #EFF5FB; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: 0 0 auto; }
  .fam-info { flex: 1; }
  .fam-name { font-size: 17px; font-weight: 600; color: var(--ink); }
  .fam-role { font-size: 14px; color: var(--ink-2); }
  .fam-add { width: 44px; height: 44px; border-radius: 50%; border: 1.5px dashed var(--primary); background: none; color: var(--primary-deep); font-size: 22px; cursor: pointer; flex: 0 0 auto; }

  /* 底部导航 */
  .tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 92px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-around; padding: 12px 12px 24px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 64px; }
  .tab-icon { width: 24px; height: 24px; color: var(--ink-2); }
  .tab.active .tab-icon { color: var(--primary); }
  .tab-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .tab.active .tab-label { color: var(--primary); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>

  <div class="content">
    <div class="greeting">
      <div>
        <div class="hi">家属您好</div>
        <div class="sub">这里是妈妈今天的用药情况</div>
      </div>
    </div>

    <div class="mom-card">
      <div class="mom-avatar">👵</div>
      <div class="mom-info">
        <div class="mom-name">王奶奶 · 78岁</div>
        <div class="mom-status warn">⚠️ 12:30 的药还没确认</div>
      </div>
    </div>

    <div class="notice">
      <div class="n-icon">🔔</div>
      <div class="n-text">
        妈妈 12:30 的阿卡波糖还没有确认
        <div class="n-sub">已提醒 2 次 · 可能已经吃了但忘了点确认</div>
      </div>
      <button class="n-btn">看看</button>
    </div>

    <div class="section-title">今日确认进度（3/4）</div>
    <div class="plan">
      <div class="plan-row plan-done">
        <span class="pill-dot" style="background:#C9E2F4;"></span>
        <span class="plan-time">7:30</span>
        <span class="plan-name">格列美脲</span>
        <span class="plan-badge">✓ 已吃</span>
      </div>
      <div class="plan-row plan-done">
        <span class="pill-dot" style="background:#F6D7A8;"></span>
        <span class="plan-time">8:00</span>
        <span class="plan-name">阿司匹林</span>
        <span class="plan-badge">✓ 已吃</span>
      </div>
      <div class="plan-row plan-miss">
        <span class="pill-dot" style="background:#D9E8D0;"></span>
        <span class="plan-time">12:30</span>
        <span class="plan-name">阿卡波糖</span>
        <span class="plan-badge">未确认</span>
      </div>
      <div class="plan-row">
        <span class="pill-dot" style="background:#E3D6EF;"></span>
        <span class="plan-time">18:30</span>
        <span class="plan-name">阿托伐他汀</span>
        <span class="plan-badge">待吃</span>
      </div>
    </div>

    <div class="section-title">家属（1/3 已绑定）</div>
    <div class="fam-row">
      <div class="fam-avatar">👩</div>
      <div class="fam-info">
        <div class="fam-name">小丽（女儿）</div>
        <div class="fam-role">可接收未确认提醒</div>
      </div>
      <button class="fam-add">＋</button>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <div class="tab">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
      <span class="tab-label">首页</span>
    </div>
    <div class="tab">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="tab-label">AI 助手</span>
    </div>
    <div class="tab active">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="tab-label">家属</span>
    </div>
    <div class="tab">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tab-label">我的</span>
    </div>
  </div>
</div>
</body>
</html>
