<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · 首页</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --border: #E5E3DC;
    --ink: #232323;
    --ink-2: #6B6B6B;
    --primary: #1D6BA8;
    --primary-deep: #155A8F;
    --accent: #E8862D;
    --success: #2F7D4F;
    --success-bg: #EAF4EE;
    --success-text: #137333;
    --radius: 20px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #D8D6D0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    display: flex; flex-direction: column;
    position: relative;
  }
  .statusbar {
    height: 54px; flex: 0 0 auto;
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 24px 8px;
    font-size: 15px; font-weight: 600; color: var(--ink);
  }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 28px; background: #232323; border-radius: 16px; }

  .content { flex: 1; overflow-y: auto; padding: 4px 20px 110px; }

  .greeting { display: flex; justify-content: space-between; align-items: flex-end; margin: 10px 0 14px; }
  .greeting .hi { font-size: 22px; font-weight: 600; color: var(--ink); }
  .greeting .sub { font-size: 15px; color: var(--ink-2); margin-top: 2px; }
  .greeting .date { font-size: 15px; color: var(--ink-2); }

  /* ===== Hero 主任务卡片 ===== */
  .hero-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 20px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,.06);
  }
  .task-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: #FDF0E3; color: #9E4A0B;
    font-size: 15px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px;
  }
  .task-tag::before { content: "●"; font-size: 10px; }
  .task-name { font-size: 40px; font-weight: 700; color: var(--ink); margin-top: 14px; line-height: 1.2; }
  .task-dose { font-size: 22px; font-weight: 600; color: var(--ink); margin-top: 4px; }

  /* 药盒视觉区：突出图片，看图拿药 */
  .medicine-visual-box {
    display: flex; align-items: center; gap: 16px;
    background: #FBF8F5;
    border-radius: 14px;
    padding: 14px 16px;
    margin: 18px 0 0;
  }
  .box-img {
    width: 72px; height: 72px; border-radius: 12px;
    background: linear-gradient(135deg, #FDF3E7, #F0DFC8);
    border: 1px solid #E4D3BC;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 5px; flex-shrink: 0;
  }
  .box-img .capsule {
    width: 46px; height: 22px;
    background: linear-gradient(90deg, #E8862D 50%, #F6C98B 50%);
    border-radius: 11px;
    position: relative;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.08);
  }
  .box-img .capsule::after {
    content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px;
    width: 2px; background: rgba(0,0,0,.10);
  }
  .box-img .capsule-name { font-size: 12px; font-weight: 700; color: #9E4A0B; }
  .visual-hint { font-size: 17px; font-weight: 500; color: var(--ink); line-height: 1.5; }
  .visual-hint small { display: block; font-size: 15px; font-weight: 400; color: var(--ink-2); margin-top: 2px; }

  /* 按钮组：上下堆叠，主按钮在下（拇指热区），防横向误触 */
  .action-button-group {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 18px;
  }
  .btn {
    width: 100%; border: none; cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease-out, background .12s ease-out;
  }
  .btn:active { transform: scale(.98); }
  .btn-secondary-repeat {
    height: 48px;
    background: #F0F7FF; color: var(--primary-deep);
    border: 1.5px solid var(--primary-deep);
    border-radius: 24px;
    font-size: 18px; font-weight: 600;
  }
  .btn-primary-done {
    height: 56px;
    background: var(--primary-deep); color: #fff;
    border-radius: 28px;
    font-size: 20px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(21,90,143,.35);
  }
  .btn-primary-done:active { background: #0F4A78; }

  /* ===== 今日计划时间轴（含药丸色点） ===== */
  .section-title { font-size: 18px; font-weight: 600; color: var(--ink); margin: 22px 0 10px; }
  .plan { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .plan-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
  }
  .plan-row:last-child { border-bottom: none; }
  .pill-dot {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.08); flex: 0 0 auto;
  }
  .plan-time { font-size: 17px; font-weight: 600; color: var(--ink); width: 58px; flex: 0 0 auto; }
  .plan-name { flex: 1; font-size: 17px; color: var(--ink); }
  .plan-done .plan-time, .plan-done .plan-name { color: #9A9A9A; text-decoration: line-through; }
  .plan-now { background: #EFF5FB; }
  .plan-now .plan-name { font-weight: 600; color: var(--primary); }
  .plan-badge {
    font-size: 15px; font-weight: 700;
    padding: 4px 12px; border-radius: 12px;
    background: var(--bg); color: var(--ink-2);
    flex: 0 0 auto; white-space: nowrap;
  }
  /* 已吃：AA 达标深绿（5.2:1） */
  .plan-done .plan-badge { background: #E6F4EA; color: var(--success-text); }
  .plan-now .plan-badge { background: var(--primary); color: #fff; }

  /* 底部导航 */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 92px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-around;
    padding: 12px 12px 24px;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 64px; }
  .tab-icon { width: 24px; height: 24px; color: var(--ink-2); }
  .tab.active .tab-icon { color: var(--primary); }
  .tab-label { font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .tab.active .tab-label { color: var(--primary); font-weight: 600; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="statusbar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="content">
    <div class="greeting">
      <div>
        <div class="hi">早上好，王奶奶</div>
        <div class="sub">今天有 4 种药要按时吃</div>
      </div>
      <div class="date">8月16日<br>周六</div>
    </div>

    <!-- Hero 主任务卡片 -->
    <div class="hero-card">
      <span class="task-tag">现在该吃药 · 早餐后</span>
      <div class="task-name">阿司匹林</div>
      <div class="task-dose">1 粒 · 用温水送服</div>

      <!-- 药盒视觉：看图拿药 -->
      <div class="medicine-visual-box">
        <div class="box-img">
          <div class="capsule"></div>
          <span class="capsule-name">阿司匹林</span>
        </div>
        <div class="visual-hint">
          照着这个药盒拿药
          <small>吃完记得点下面的大按钮</small>
        </div>
      </div>

      <!-- 按钮组：上下堆叠防误触 -->
      <div class="action-button-group">
        <button class="btn btn-secondary-repeat">再说一遍</button>
        <button class="btn btn-primary-done">我吃好了</button>
      </div>
    </div>

    <!-- 今日计划时间轴 -->
    <div class="section-title">今天的药</div>
    <div class="plan">
      <div class="plan-row plan-done">
        <span class="pill-dot" style="background:#C9E2F4;"></span>
        <span class="plan-time">7:30</span>
        <span class="plan-name">格列美脲</span>
        <span class="plan-badge">✓ 已吃</span>
      </div>
      <div class="plan-row plan-now">
        <span class="pill-dot" style="background:#F6D7A8;"></span>
        <span class="plan-time">8:00</span>
        <span class="plan-name">阿司匹林</span>
        <span class="plan-badge">现在</span>
      </div>
      <div class="plan-row">
        <span class="pill-dot" style="background:#D9E8D0;"></span>
        <span class="plan-time">12:30</span>
        <span class="plan-name">阿卡波糖</span>
        <span class="plan-badge">待吃</span>
      </div>
      <div class="plan-row">
        <span class="pill-dot" style="background:#E3D6EF;"></span>
        <span class="plan-time">18:30</span>
        <span class="plan-name">阿托伐他汀</span>
        <span class="plan-badge">待吃</span>
      </div>
    </div>
  </div>

  <!-- 底部导航 -->
  <div class="tabbar">
    <div class="tab active">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
      <span class="tab-label">首页</span>
    </div>
    <div class="tab">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="tab-label">AI 助手</span>
    </div>
    <div class="tab">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="tab-label">家属</span>
    </div>
    <div class="tab">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="tab-label">我的</span>
    </div>
  </div>
</div>
</body>
</html>
