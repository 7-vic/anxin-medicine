<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安心用药 · 首页</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/misans-webfont@4.3.1/index.css">
<style>
  :root {
    --bg: #FBF9F5; --card: #FFFFFF; --border-soft: #F0EAE1;
    --ink: #2D3142; --ink-2: #6C757D;
    --primary: #00796B; --primary-deep: #00695C; --primary-glow: rgba(0,121,107,.28);
    --primary-light: #E6F6F2;
    --warning: #FF9F43; --warning-light: #FFF0E1; --warning-text: #C05F14;
    --success: #2F7D4F; --success-bg: #E6F4EA; --success-text: #137333;
    --radius-card: 24px; --radius-btn: 999px;
    --shadow-smooth: 0 10px 30px -5px rgba(45,49,66,.05), 0 4px 12px -2px rgba(45,49,66,.03);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "MiSans", "HarmonyOS Sans SC", "OPPO Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #E8E4DC; display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; background: var(--bg); border-radius: 44px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; position: relative;
  }
  .statusbar { height: 54px; flex: 0 0 auto; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 15px; font-weight: 600; color: var(--ink); }
  .notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 120px; height: 28px; background: #2D3142; border-radius: 16px; }
  .content { flex: 1; overflow-y: auto; padding: 4px 20px 130px; }

  .greeting { display: flex; justify-content: space-between; align-items: flex-end; margin: 10px 0 16px; }
  .greeting .hi { font-size: 24px; font-weight: 700; color: var(--ink); }
  .greeting .sub { font-size: 16px; color: var(--ink-2); margin-top: 3px; letter-spacing: .3px; }
  .greeting .date { font-size: 16px; color: var(--ink-2); text-align: right; }

  /* ===== Hero 主任务卡片 ===== */
  .hero-card {
    background: var(--card); border: 2px solid var(--border-soft);
    border-radius: var(--radius-card); padding: 24px 22px 22px;
    box-shadow: var(--shadow-smooth); position: relative;
  }
  .voice-btn {
    position: absolute; top: 18px; right: 18px;
    width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--primary-light); font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .task-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--warning-light); color: var(--warning-text);
    font-size: 16px; font-weight: 700; padding: 7px 14px; border-radius: 999px;
  }
  .task-tag::before { content: "●"; font-size: 10px; }
  .task-name { font-size: 40px; font-weight: 700; color: var(--ink); margin-top: 16px; line-height: 1.2; }
  .task-dose { font-size: 24px; font-weight: 700; color: var(--ink); margin-top: 4px; letter-spacing: .5px; }

  /* 药盒视觉区：看图拿药 */
  .medicine-visual-box {
    display: flex; align-items: center; gap: 16px;
    background: #FCFAF6; border: 1px solid var(--border-soft);
    border-radius: 18px; padding: 14px 16px; margin: 18px 0 0;
  }
  .box-img {
    width: 72px; height: 72px; border-radius: 16px;
    background: linear-gradient(135deg, #FDF3E7, #F0DFC8);
    border: 1px solid #E4D3BC;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; flex-shrink: 0;
  }
  .box-img .capsule {
    width: 46px; height: 22px;
    background: linear-gradient(90deg, #E8862D 50%, #F6C98B 50%);
    border-radius: 11px; position: relative;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,.08);
  }
  .box-img .capsule::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: rgba(0,0,0,.10); }
  .box-img .capsule-name { font-size: 12px; font-weight: 700; color: #9E4A0B; }
  .visual-hint { font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.5; }
  .visual-hint small { display: block; margin-top: 4px; font-size: 17px; font-weight: 700; color: var(--primary); }

  /* 按钮组：上下堆叠 */
  .action-button-group { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .btn {
    width: 100%; border: none; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .btn:active { transform: scale(.96); }
  .btn-secondary-repeat {
    height: 50px; background: var(--primary-light); color: var(--primary-deep);
    border: 1.5px solid var(--primary); border-radius: var(--radius-btn);
    font-size: 19px; font-weight: 700;
  }
  .btn-primary-done {
    height: 60px; color: #fff; border-radius: var(--radius-btn);
    font-size: 22px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(135deg, #00897B, #00695C);
    box-shadow: 0 12px 24px -6px var(--primary-glow);
  }

  /* ===== 今日计划时间轴 ===== */
  .section-title { font-size: 19px; font-weight: 700; color: var(--ink); margin: 24px 0 12px; }
  .plan { background: var(--card); border: 1px solid var(--border-soft); border-radius: var(--radius-card); overflow: hidden; box-shadow: var(--shadow-smooth); }
  .plan-row { display: flex; align-items: center; gap: 14px; padding: 15px 18px; border-bottom: 1px solid var(--border-soft); }
  .plan-row:last-child { border-bottom: none; }
  /* 药丸图形：形状+颜色区分 */
  .pill-graphic { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; }
  .pg-capsule { width: 26px; height: 13px; border-radius: 7px; position: relative; box-shadow: inset 0 -2px 2px rgba(0,0,0,.08); }
  .pg-capsule::after { content: ""; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1.5px; background: rgba(0,0,0,.12); }
  .pg-round { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 -2px 2px rgba(0,0,0,.08); }
  .pg-oval { width: 26px; height: 15px; border-radius: 50%; box-shadow: inset 0 -2px 2px rgba(0,0,0,.08); }
  .plan-time { font-size: 18px; font-weight: 700; color: var(--ink); width: 62px; flex: 0 0 auto; }
  .plan-name { flex: 1; font-size: 18px; color: var(--ink); }
  .plan-done .plan-time, .plan-done .plan-name { color: #767676; text-decoration: line-through; }
  .plan-now { background: var(--primary-light); }
  .plan-now .plan-name { font-weight: 700; color: var(--primary-deep); }
  .plan-badge { font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 12px; background: var(--bg); color: var(--ink-2); flex: 0 0 auto; white-space: nowrap; }
  .plan-done .plan-badge { background: var(--success-bg); color: var(--success-text); }
  .plan-now .plan-badge { background: var(--primary); color: #fff; }

  /* 悬浮胶囊 TabBar */
  .tabbar {
    position: absolute; bottom: 20px; left: 20px; right: 20px; height: 72px;
    background: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border-radius: var(--radius-btn); box-shadow: 0 12px 32px rgba(0,0,0,.10);
    display: flex; align-items: center; justify-content: space-around;
  }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 72px; } text-decoration: none; color: inherit;
  .tab-icon { width: 26px; height: 26px; color: var(--ink-2); }
  .tab.active .tab-icon { color: var(--primary); }
  .tab-label { font-size: 14px; color: var(--ink-2); font-weight: 600; }
  .tab.active .tab-label { color: var(--primary); font-weight: 700; }
  .back-btn {
    position: absolute; top: 60px; left: 16px; z-index: 20;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.88);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 2px 8px rgba(0,0,0,.10);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; color: var(--ink); text-decoration: none;
  }
  .back-btn:active { transform: scale(.92); }
</style>
</head>
<body>
<div class="phone">
  <a class="back-btn" href="pages.html" aria-label="返回">‹</a>
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>📶 🔋</span></div>

  <div class="content">
    <div class="greeting">
      <div>
        <div class="hi">早上好，王奶奶</div>
        <div class="sub">今天有 4 种药要按时吃</div>
      </div>
      <div class="date">8月16日<br>周六</div>
    </div>

    <div class="hero-card">
      <button class="voice-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="#00796B"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></button>
      <span class="task-tag">现在该吃药 · 早餐后</span>
      <div class="task-name">阿司匹林</div>
      <div class="task-dose">1 粒 · 用温水送服</div>

      <div class="medicine-visual-box">
        <div class="box-img">
          <div class="capsule"></div>
          <span class="capsule-name">阿司匹林</span>
        </div>
        <div class="visual-hint">
          照着这个药盒拿药
          <small>吃完点【我吃好了】</small>
        </div>
      </div>

      <div class="action-button-group">
        <button class="btn btn-secondary-repeat">再说一遍</button>
        <button class="btn btn-primary-done">我吃好了</button>
      </div>
    </div>

    <div class="section-title">今天的药</div>
    <div class="plan">
      <div class="plan-row plan-done">
        <div class="pill-graphic"><span class="pg-capsule" style="background:linear-gradient(90deg,#9DBFD8 50%,#D6E5F0 50%);"></span></div>
        <span class="plan-time">7:30</span>
        <span class="plan-name">格列美脲</span>
        <span class="plan-badge">✓ 已吃</span>
      </div>
      <div class="plan-row plan-now">
        <div class="pill-graphic"><span class="pg-capsule" style="background:linear-gradient(90deg,#E8862D 50%,#F6C98B 50%);"></span></div>
        <span class="plan-time">8:00</span>
        <span class="plan-name">阿司匹林</span>
        <span class="plan-badge">现在</span>
      </div>
      <div class="plan-row">
        <div class="pill-graphic"><span class="pg-round" style="background:#A8D5B5;"></span></div>
        <span class="plan-time">12:30</span>
        <span class="plan-name">阿卡波糖</span>
        <span class="plan-badge">待吃</span>
      </div>
      <div class="plan-row">
        <div class="pill-graphic"><span class="pg-oval" style="background:#C9B8E0;"></span></div>
        <span class="plan-time">18:30</span>
        <span class="plan-name">阿托伐他汀</span>
        <span class="plan-badge">待吃</span>
      </div>
    </div>
  </div>

  <!-- 悬浮胶囊 TabBar -->
  <div class="tabbar">
    <a class="tab active" href="index.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></a>
    <a class="tab" href="assistant.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></a>
    <a class="tab" href="family.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></a>
    <a class="tab" href="profile.html"><svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></a>
  </div>
</div>
<script>
  const doneBtn = document.querySelector('.btn-primary-done');
  if (doneBtn) {
    doneBtn.addEventListener('click', () => {
      if (navigator.vibrate) navigator.vibrate(15);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 620;
        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
      doneBtn.textContent = '✓ 已确认，谢谢奶奶';
      doneBtn.style.background = 'linear-gradient(135deg,#2F8F5B,#1E6B42)';
      setTimeout(() => { doneBtn.textContent = '我吃好了'; doneBtn.style.background = ''; }, 1800);
    });
  }
</script>
</body>
</html>
